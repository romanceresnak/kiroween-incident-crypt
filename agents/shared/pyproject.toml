[project]
name = "kiroween-shared"
version = "0.1.0"
description = "Shared Bedrock client, metrics and read-only Kubernetes tools for the Kiroween agents"
requires-python = ">=3.12,<3.13"
dependencies = [
    "strands-agents",
    "boto3",
    "kubernetes",
    "prometheus-client",
    "fastapi",
    "uvicorn",
    "httpx",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiroween_shared"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
