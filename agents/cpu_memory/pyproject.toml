[project]
name = "kiroween-cpu-memory"
version = "0.1.0"
description = "cpu-memory specialist agent"
requires-python = ">=3.12,<3.13"
dependencies = ["kiroween-shared"]

[tool.uv.sources]
kiroween-shared = { path = "../shared", editable = true }

[dependency-groups]
dev = ["pytest", "pytest-asyncio", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/kiroween_cpu_memory"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]
