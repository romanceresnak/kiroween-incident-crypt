<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">The Vampire, who drinks CPU and memory</title>
  <circle cx="60" cy="60" r="58" fill="#2a0d17"/>
  <!-- cape collar -->
  <path d="M18 112 L34 60 L60 80 L86 60 L102 112 Z" fill="#7a0f24"/>
  <path d="M34 60 L26 40 L50 64 Z M86 60 L94 40 L70 64 Z" fill="#a3142f"/>
  <!-- face -->
  <ellipse cx="60" cy="56" rx="20" ry="24" fill="#e8e3ef"/>
  <!-- hair with widow's peak -->
  <path d="M40 50 Q40 28 60 28 Q80 28 80 50 Q72 40 60 46 Q48 40 40 50 Z" fill="#17101f"/>
  <!-- eyes -->
  <path d="M48 54 L56 56 L48 58 Z" fill="#c4122e"/>
  <path d="M72 54 L64 56 L72 58 Z" fill="#c4122e"/>
  <!-- smile and fangs -->
  <path d="M50 68 Q60 74 70 68" stroke="#5c0a19" stroke-width="2" fill="none"/>
  <path d="M54 69 L56 75 L58 70 Z M62 70 L64 75 L66 69 Z" fill="#ffffff"/>
  <!-- a memory chip, held like a goblet -->
  <rect x="44" y="92" width="32" height="12" rx="2" fill="#2f6b3a"/>
  <rect x="47" y="95" width="6" height="6" fill="#d8b04a"/>
  <rect x="57" y="95" width="6" height="6" fill="#d8b04a"/>
  <rect x="67" y="95" width="6" height="6" fill="#d8b04a"/>
</svg>
