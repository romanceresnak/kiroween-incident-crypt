<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" role="img" aria-labelledby="t">
  <title id="t">The Zombie, who brings rollouts back from the dead</title>
  <circle cx="60" cy="60" r="58" fill="#16220f"/>
  <!-- shirt -->
  <path d="M30 114 L36 82 Q60 72 84 82 L90 114 Z" fill="#5a4a3a"/>
  <path d="M44 90 L50 98 L46 104 Z M74 92 L70 100 L76 104 Z" fill="#16220f"/>
  <!-- head -->
  <rect x="38" y="30" width="44" height="48" rx="12" fill="#8fb26a"/>
  <path d="M38 40 Q46 26 60 28 Q74 24 82 38 L82 34 Q70 18 52 22 Q40 26 38 40 Z" fill="#3b2f22"/>
  <!-- stitches -->
  <path d="M64 34 L78 46" stroke="#3b2f22" stroke-width="2"/>
  <path d="M66 38 L70 34 M70 42 L74 38 M74 46 L78 42" stroke="#3b2f22" stroke-width="1.5"/>
  <!-- eyes: one round, one droopy -->
  <circle cx="50" cy="52" r="6" fill="#f2f0d8"/>
  <circle cx="51" cy="53" r="2.5" fill="#1d1d1d"/>
  <ellipse cx="70" cy="54" rx="6" ry="4" fill="#f2f0d8"/>
  <circle cx="70" cy="55" r="2" fill="#1d1d1d"/>
  <!-- mouth -->
  <path d="M48 68 L72 68" stroke="#2c3a1d" stroke-width="3" stroke-linecap="round"/>
  <path d="M54 66 L54 70 M60 66 L60 70 M66 66 L66 70" stroke="#2c3a1d" stroke-width="1.5"/>
  <!-- a rollout tag on a string -->
  <path d="M86 84 L98 70" stroke="#c9b48a" stroke-width="1.5"/>
  <rect x="94" y="60" width="18" height="11" rx="2" fill="#ff9a3c"/>
  <text x="96" y="68.5" font-family="monospace" font-size="7" fill="#16220f">v1</text>
</svg>
