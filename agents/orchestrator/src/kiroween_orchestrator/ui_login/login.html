<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in - Kiroween Incident Crypt</title>
  <link rel="stylesheet" href="/login-assets/login.css">
  <link rel="icon" href="/ui/art/ghost.svg" type="image/svg+xml">
</head>
<body>
  <main class="card">
    <img src="/ui/art/necromancer.svg" alt="" width="96" height="96">
    <h1>Kiroween Incident Crypt</h1>
    <p class="muted">Sign in to investigate failures on a live Kubernetes cluster. The agents
      read the cluster and propose fixes; nothing is applied without a person.</p>
    <form id="login" autocomplete="on" novalidate>
      <label for="username">User name</label>
      <input id="username" name="username" autocomplete="username" maxlength="128" required>
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password"
             maxlength="256" required>
      <button id="submit" type="submit">Sign in</button>
      <p id="message" role="alert" class="error"></p>
    </form>
  </main>
  <script src="/login-assets/login.js"></script>
</body>
</html>
