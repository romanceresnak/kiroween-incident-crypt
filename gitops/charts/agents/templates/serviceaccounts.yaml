{{- /* Names match the infra Pod Identity associations (agents/<agent>-sa) (REQ-CHT-02). */ -}}
{{- range $name := list "orchestrator-sa" "cpu-memory-sa" "network-sa" "deploy-rollout-sa" "storage-sa" "orchestrator-watcher-sa" }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "agents.labels" $ | nindent 4 }}
{{- end }}
