{{- $checksum := include (print $.Template.BasePath "/configmap.yaml") . | sha256sum -}}
{{- $orch := .Values.images.orchestrator -}}
{{- $cpu := .Values.images.cpuMemory -}}

{{- if ne (toString $orch.tag) "unset" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator
  labels:
    {{- include "agents.labels" . | nindent 4 }}
    app.kubernetes.io/name: orchestrator
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: orchestrator}
  template:
    metadata:
      labels:
        {{- include "agents.labels" . | nindent 8 }}
        app.kubernetes.io/name: orchestrator
      annotations:
        checksum/config: {{ $checksum }}
    spec:
      serviceAccountName: orchestrator-sa
      securityContext:
        {{- include "agents.podSecurityContext" . | nindent 8 }}
      containers:
        - name: orchestrator
          image: {{ include "agents.image" (dict "root" . "image" $orch) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-m", "kiroween_orchestrator"]
          ports:
            - {name: api, containerPort: {{ .Values.ports.api }}}
            - {name: metrics, containerPort: {{ .Values.ports.metrics }}}
          env:
            {{- include "agents.commonEnv" . | nindent 12 }}
            - {name: MODEL_ID, value: {{ .Values.models.orchestrator | quote }}}
            {{- /* A URL only for specialists that are deployed; the rest end as no_specialist. */}}
            {{- range $line := splitList "\n" (include "agents.specialists" .) }}
            {{- $f := splitList ":" $line }}
            {{- if ne (toString (index $.Values.images (index $f 1)).tag) "unset" }}
            - {name: {{ index $f 3 }}, value: "http://{{ index $f 0 }}:{{ $.Values.ports.api }}"}
            {{- end }}
            {{- end }}
            - {name: WORKERS, value: {{ .Values.orchestrator.workers | quote }}}
            - {name: QUEUE_SIZE, value: {{ .Values.orchestrator.queueSize | quote }}}
            - {name: STORE_CAPACITY, value: {{ .Values.orchestrator.storeCapacity | quote }}}
            - name: INCIDENT_TIMEOUT_SECONDS
              value: {{ .Values.orchestrator.incidentTimeoutSeconds | quote }}
            - name: DELEGATION_TIMEOUT_SECONDS
              value: {{ .Values.orchestrator.delegationTimeoutSeconds | quote }}
            - name: CORRELATION_WINDOW_SECONDS
              value: {{ .Values.orchestrator.correlationWindowSeconds | quote }}
            - {name: GITHUB_REPOSITORY, value: {{ .Values.orchestrator.github.repository | quote }}}
            - {name: GITHUB_BASE_BRANCH, value: {{ .Values.orchestrator.github.baseBranch | quote }}}
            - {name: LAB_GITHUB_BRANCH, value: {{ .Values.orchestrator.github.labBranch | quote }}}
            # Login (scenario-lab REQ-AU). The Secret is created by the operator and is optional
            # here: without it the orchestrator answers 503 to everything but the health probes,
            # it never falls back to open access.
            - {name: AUTH_REQUIRED, value: {{ .Values.auth.required | quote }}}
            - {name: AUTH_LAB_ONLY, value: {{ .Values.auth.labOnly | quote }}}
            - {name: TRUSTED_PROXY_HOPS, value: {{ .Values.auth.trustedProxyHops | quote }}}
            - {name: PUBLIC_HOSTS, value: {{ join "," .Values.auth.publicHosts | quote }}}
            {{- if .Values.lab.enabled }}
            - {name: LAB_RUNNER_URL, value: "http://lab-runner:{{ .Values.ports.api }}"}
            {{- end }}
            - name: AUTH_USERNAME
              valueFrom:
                secretKeyRef: {name: {{ .Values.auth.secretName }}, key: username, optional: true}
            - name: AUTH_PASSWORD
              valueFrom:
                secretKeyRef: {name: {{ .Values.auth.secretName }}, key: password, optional: true}
            - name: AUTH_INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.auth.secretName }}, key: internal-token, optional: true}
            # Optional: no Secret means approvals are dry runs (REQ-APR-05).
            - name: GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.orchestrator.github.tokenSecret }}
                  key: token
                  optional: true
            # Self-learning memory: all three of bucket, KB ID and data source ID are
            # needed, otherwise approvals record "not configured" (polish REQ-LRN-07).
            - {name: LEARNING_BUCKET, value: {{ .Values.orchestrator.learning.bucket | quote }}}
            - {name: LEARNING_PREFIX, value: {{ .Values.orchestrator.learning.prefix | quote }}}
            - {name: KNOWLEDGE_BASE_ID, value: {{ .Values.incidentMemory.knowledgeBaseId | quote }}}
            - name: KNOWLEDGE_BASE_DATA_SOURCE_ID
              value: {{ .Values.orchestrator.learning.dataSourceId | quote }}
          securityContext:
            {{- include "agents.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.orchestrator.resources | nindent 12 }}
          {{- include "agents.probes" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "agents.tmpVolume" . | nindent 8 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: orchestrator-watcher
  labels:
    {{- include "agents.labels" . | nindent 4 }}
    app.kubernetes.io/name: orchestrator-watcher
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: orchestrator-watcher}
  template:
    metadata:
      labels:
        {{- include "agents.labels" . | nindent 8 }}
        app.kubernetes.io/name: orchestrator-watcher
    spec:
      serviceAccountName: orchestrator-watcher-sa
      securityContext:
        {{- include "agents.podSecurityContext" . | nindent 8 }}
      containers:
        - name: watcher
          # Same image as the orchestrator, different entrypoint (REQ-WAT-01).
          image: {{ include "agents.image" (dict "root" . "image" $orch) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-m", "kiroween_orchestrator.watcher"]
          ports:
            - {name: api, containerPort: {{ .Values.ports.api }}}
          env:
            - {name: HOME, value: /tmp}
            - {name: LOG_LEVEL, value: {{ .Values.logLevel | quote }}}
            - {name: API_PORT, value: {{ .Values.ports.api | quote }}}
            - {name: ORCHESTRATOR_URL, value: "http://orchestrator:{{ .Values.ports.api }}"}
            # The orchestrator requires a login; the watcher authenticates with this token
            # (scenario-lab REQ-AU-09). Optional, so a missing Secret shows as rejected
            # incidents in the log and not as a crashing pod.
            - name: ORCHESTRATOR_TOKEN
              valueFrom:
                secretKeyRef: {name: {{ .Values.auth.secretName }}, key: internal-token, optional: true}
            - {name: WATCH_REASONS, value: {{ join "," .Values.watcher.reasons | quote }}}
            - name: WAITING_REASONS
              value: {{ join "," .Values.watcher.waitingReasons | quote }}
            - name: POD_EVENT_REASONS
              value: {{ join "," .Values.watcher.podEventReasons | quote }}
            - name: PVC_EVENT_REASONS
              value: {{ join "," .Values.watcher.pvcEventReasons | quote }}
            - name: EXCLUDED_NAMESPACES
              value: {{ join "," .Values.watcher.excludedNamespaces | quote }}
            - {name: COOLDOWN_SECONDS, value: {{ .Values.watcher.cooldownSeconds | quote }}}
            - name: STARTUP_GRACE_SECONDS
              value: {{ .Values.watcher.startupGraceSeconds | quote }}
            - name: UNHEALTHY_STARTUP_GRACE_SECONDS
              value: {{ .Values.watcher.unhealthyStartupGraceSeconds | quote }}
            - name: UNHEALTHY_RECHECK_SECONDS
              value: {{ .Values.watcher.unhealthyRecheckSeconds | quote }}
          securityContext:
            {{- include "agents.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.watcher.resources | nindent 12 }}
          {{- include "agents.probes" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "agents.tmpVolume" . | nindent 8 }}
{{- end }}

{{- if ne (toString $cpu.tag) "unset" }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cpu-memory
  labels:
    {{- include "agents.labels" . | nindent 4 }}
    app.kubernetes.io/name: cpu-memory
spec:
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: cpu-memory}
  template:
    metadata:
      labels:
        {{- include "agents.labels" . | nindent 8 }}
        app.kubernetes.io/name: cpu-memory
      annotations:
        checksum/config: {{ $checksum }}
    spec:
      serviceAccountName: cpu-memory-sa
      securityContext:
        {{- include "agents.podSecurityContext" . | nindent 8 }}
      containers:
        - name: cpu-memory
          image: {{ include "agents.image" (dict "root" . "image" $cpu) }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args: ["-m", "kiroween_cpu_memory"]
          ports:
            - {name: api, containerPort: {{ .Values.ports.api }}}
            - {name: metrics, containerPort: {{ .Values.ports.metrics }}}
          env:
            {{- include "agents.commonEnv" . | nindent 12 }}
            - {name: MODEL_ID, value: {{ .Values.models.cpuMemory | quote }}}
            - {name: MAX_INCREASE_FACTOR, value: {{ .Values.cpuMemory.maxIncreaseFactor | quote }}}
          securityContext:
            {{- include "agents.containerSecurityContext" . | nindent 12 }}
          resources:
            {{- toYaml .Values.cpuMemory.resources | nindent 12 }}
          {{- include "agents.probes" . | nindent 10 }}
          volumeMounts:
            - {name: tmp, mountPath: /tmp}
      volumes:
        {{- include "agents.tmpVolume" . | nindent 8 }}
{{- end }}
