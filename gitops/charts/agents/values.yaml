# Values for the agents chart. Argo CD deploys it into the namespace "agents".

image:
  registry: 255834079310.dkr.ecr.eu-west-1.amazonaws.com
  pullPolicy: IfNotPresent

# The image workflow rewrites the tag lines below (tools/set_image_tag.py). Do not
# edit them by hand. While a tag is "unset", that component's Deployment is not
# rendered, so the first sync does not leave pods in ImagePullBackOff.
images:
  orchestrator:
    repository: kiroween/orchestrator
    tag: b0a151e88a88abc31a050af23d9e2df25ed53ad8 # ci-managed:orchestrator
  cpuMemory:
    repository: kiroween/cpu-memory
    tag: b0a151e88a88abc31a050af23d9e2df25ed53ad8 # ci-managed:cpu-memory
  network:
    repository: kiroween/network
    tag: b0a151e88a88abc31a050af23d9e2df25ed53ad8 # ci-managed:network
  deployRollout:
    repository: kiroween/deploy-rollout
    tag: b0a151e88a88abc31a050af23d9e2df25ed53ad8 # ci-managed:deploy-rollout
  storage:
    repository: kiroween/storage
    tag: b0a151e88a88abc31a050af23d9e2df25ed53ad8 # ci-managed:storage
  incidentMemory:
    repository: kiroween/incident-memory
    tag: b0a151e88a88abc31a050af23d9e2df25ed53ad8 # ci-managed:incident-memory

region: eu-west-1

# EU cross-region inference profiles (REQ-BED-02). Changing a model is a values change.
models:
  orchestrator: eu.anthropic.claude-haiku-4-5-20251001-v1:0
  cpuMemory: eu.anthropic.claude-sonnet-4-6
  network: eu.anthropic.claude-sonnet-4-6
  deployRollout: eu.anthropic.claude-sonnet-4-6
  storage: eu.anthropic.claude-sonnet-4-6

# USD per million tokens, by model id, for the EU geo cross-region profiles. A model with
# no entry records token counters only.
# Verify these against https://aws.amazon.com/bedrock/pricing before relying on the cost
# metric; they were supplied by hand, not read from AWS.
prices:
  "eu.anthropic.claude-haiku-4-5-20251001-v1:0":
    input: 1.10
    output: 5.50
  "eu.anthropic.claude-sonnet-4-6":
    input: 3.30
    output: 16.50

maxModelCalls: 15
maxTokens: 4096
logLevel: INFO

ports:
  api: 8080
  metrics: 9090

orchestrator:
  workers: 2
  queueSize: 20
  storeCapacity: 500
  incidentTimeoutSeconds: 300
  delegationTimeoutSeconds: 120
  # Incidents in one namespace within this window that share a workload or a dependency
  # are attached to the first one instead of investigated again. 0 disables it.
  correlationWindowSeconds: 300
  # Approved proposals become a PR against /gitops (memory-and-ui REQ-APR). The token is read
  # from this Secret if it exists (key "token"); without it every approval is a dry run.
  # The chart never creates the Secret.
  github:
    repository: romanceresnak/kiroween-incident-crypt
    baseBranch: main
    # Pull requests for lab incidents (lab-01..lab-14) go here and never to baseBranch. The
    # branch is created from baseBranch on the first one (scenario-lab REQ-SB).
    labBranch: lab-remediations
    tokenSecret: orchestrator-github
  # Approved incidents are written as postmortems under <prefix> in the postmortem bucket
  # and the Knowledge Base is re-indexed (polish REQ-LRN). Learning is off, and approvals
  # record "not configured", if dataSourceId is empty. The role may start an ingestion job
  # but may not list data sources, so the ID is configuration. Read from AWS on 18 Nov 2026
  # (the KB's only data source, kiroween-prod-postmortems-s3):
  #   aws bedrock-agent list-data-sources --knowledge-base-id VIBAT27SDH --region eu-west-1 \
  #     --query 'dataSourceSummaries[].dataSourceId' --output text
  # It changes if the data source is recreated. The IAM permission is
  # infra/modules/pod_identity (learn-postmortems).
  learning:
    bucket: kiroween-prod-postmortems-255834079310
    prefix: learned/
    dataSourceId: UCADW10RQV
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}

watcher:
  # Container termination reasons (pod status).
  reasons: [OOMKilled]
  # Container waiting reasons (pod status), reported once per pod.
  waitingReasons: [ImagePullBackOff, ErrImagePull, CrashLoopBackOff, CreateContainerConfigError]
  # Event reasons, by involved object kind.
  podEventReasons: [FailedScheduling, FailedMount, FailedAttachVolume, Unhealthy]
  pvcEventReasons: [ProvisioningFailed]
  # agents is excluded so the agents never investigate themselves.
  excludedNamespaces: [kube-system, kube-node-lease, argocd, agents, monitoring]
  cooldownSeconds: 600
  startupGraceSeconds: 300
  # An Unhealthy event is re-checked before it becomes an incident: no earlier than
  # unhealthyRecheckSeconds after the event and unhealthyStartupGraceSeconds after the
  # container started, and only if the pod is still not Ready (hardening REQ-WSU).
  unhealthyStartupGraceSeconds: 60
  unhealthyRecheckSeconds: 30
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}

cpuMemory:
  maxIncreaseFactor: "4"
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}

# The three specialists added by the specialists spec. Same runtime, different tools.
network:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}

deployRollout:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}

storage:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}

# Bedrock Knowledge Base search over docs/postmortems (memory-and-ui REQ-MEM-03).
# knowledgeBaseId is the infra output knowledge_base_id.
incidentMemory:
  knowledgeBaseId: VIBAT27SDH
  topK: 3
  # Hits scoring below this are dropped (0 to 1; the pod refuses to start otherwise). Scores
  # cannot separate a right and a wrong postmortem (0.71 against 0.70 on 17 Nov): that is the
  # category filter's job. This only removes weak matches. 0.5 is provisional until it is
  # checked against live scores (polish tasks.md, TASK-02); lower it if good hits vanish.
  minScore: "0.5"
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}

metrics:
  serviceMonitor:
    # kube-prometheus-stack (gitops/apps/monitoring.yaml) provides the CRD (REQ-MON-03).
    enabled: true
  # Grafana dashboards as a ConfigMap picked up by the Grafana sidecar (REQ-MON-04).
  dashboards:
    enabled: true

networkPolicy:
  enabled: true
  prometheus:
    # Namespace allowed to scrape the metrics port. Nothing runs there yet.
    namespaceLabels:
      kubernetes.io/metadata.name: monitoring
  # EKS Pod Identity Agent on every node. Pods fetch their AWS credentials from it.
  podIdentityAgentCIDR: 169.254.170.23/32

# Login for the UI and the API (scenario-lab REQ-AU). The operator creates the Secret; this
# chart never does:
#   kubectl -n agents create secret generic orchestrator-auth \
#     --from-literal=username=<judge> --from-literal=password=<password> \
#     --from-literal=internal-token="$(openssl rand -hex 32)"
# Without it every route except the health probes answers 503, and the watcher's incidents are
# refused until it exists.
auth:
  required: true
  secretName: orchestrator-auth
  # The one account decides, and submits incidents for, lab-01..lab-14 only. Set false to let
  # it decide real incidents too (their pull requests go to the main branch).
  labOnly: true
  # CloudFront and the ALB each append one address to X-Forwarded-For; the client address is the
  # second from the right (see auth.client_ip).
  trustedProxyHops: 2
  # Hosts a browser may send as Origin in addition to the Host header (the CloudFront domain).
  publicHosts:
    - d3uh8kq3w5msy5.cloudfront.net

# The Scenario Lab (scenario-lab): 14 namespaces lab-01..lab-14 and the lab-runner that is the
# only workload allowed to create and delete things in them. One scenario at a time, ten runs
# an hour, cleaned up after fifteen minutes. The quota bounds everything a run can create.
lab:
  enabled: true
  maxRunsPerHour: 10
  cleanupSeconds: 900
  quota:
    requests.cpu: 500m
    requests.memory: 512Mi
    limits.cpu: "1"
    limits.memory: 1Gi
    pods: "10"
    persistentvolumeclaims: "2"
    requests.storage: 2Gi
    services: "4"
    configmaps: "6"
  limitRange:
    default: {cpu: 50m, memory: 64Mi}
    defaultRequest: {cpu: 5m, memory: 16Mi}
    max: {cpu: 200m, memory: 128Mi}
  runner:
    resources:
      requests: {cpu: 20m, memory: 96Mi}
      limits: {cpu: 200m, memory: 192Mi}

# Public HTTPS access for judging (scenario-lab). CloudFront reaches an internal ALB through a
# VPC origin; the ALB's target group is bound to the orchestrator by a TargetGroupBinding.
# Values come from the infra outputs target_group_arn and private_subnet_cidrs. With no
# targetGroupArn nothing here is rendered.
publicAccess:
  enabled: true
  targetGroupArn: arn:aws:elasticloadbalancing:eu-west-1:255834079310:targetgroup/kiroween-prod-orch/1fe86cc9b16b61db
  # Source addresses of the internal ALB: the two private subnets (the pods use them too).
  albCidrs:
    - 10.0.16.0/20
    - 10.0.32.0/20
