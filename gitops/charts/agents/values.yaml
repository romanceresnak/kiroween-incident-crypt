# Values for the agents chart. Argo CD deploys it into the namespace "agents".

image:
  registry: 255834079310.dkr.ecr.eu-west-1.amazonaws.com
  pullPolicy: IfNotPresent

# The image workflow rewrites the tag lines below (tools/set_image_tag.py). Do not
# edit them by hand. While a tag is "unset", that component's Deployment is not
# rendered, so the first sync does not leave pods in ImagePullBackOff.
images:
  orchestrator:
    repository: kiroween/orchestrator
    tag: bc0afabdda64e371ab389c98dff02b75c7d77997 # ci-managed:orchestrator
  cpuMemory:
    repository: kiroween/cpu-memory
    tag: bc0afabdda64e371ab389c98dff02b75c7d77997 # ci-managed:cpu-memory
  network:
    repository: kiroween/network
    tag: bc0afabdda64e371ab389c98dff02b75c7d77997 # ci-managed:network
  deployRollout:
    repository: kiroween/deploy-rollout
    tag: bc0afabdda64e371ab389c98dff02b75c7d77997 # ci-managed:deploy-rollout
  storage:
    repository: kiroween/storage
    tag: bc0afabdda64e371ab389c98dff02b75c7d77997 # ci-managed:storage

region: eu-west-1

# EU cross-region inference profiles (REQ-BED-02). Changing a model is a values change.
models:
  orchestrator: eu.anthropic.claude-haiku-4-5-20251001-v1:0
  cpuMemory: eu.anthropic.claude-sonnet-4-6
  network: eu.anthropic.claude-sonnet-4-6
  deployRollout: eu.anthropic.claude-sonnet-4-6
  storage: eu.anthropic.claude-sonnet-4-6

# USD per million tokens, by model id, for the EU geo cross-region profiles. A model with
# no entry records token counters only.
# Verify these against https://aws.amazon.com/bedrock/pricing before relying on the cost
# metric; they were supplied by hand, not read from AWS.
prices:
  "eu.anthropic.claude-haiku-4-5-20251001-v1:0":
    input: 1.10
    output: 5.50
  "eu.anthropic.claude-sonnet-4-6":
    input: 3.30
    output: 16.50

maxModelCalls: 15
maxTokens: 4096
logLevel: INFO

ports:
  api: 8080
  metrics: 9090

orchestrator:
  workers: 2
  queueSize: 20
  storeCapacity: 500
  incidentTimeoutSeconds: 300
  delegationTimeoutSeconds: 120
  # Incidents in one namespace within this window that share a workload or a dependency
  # are attached to the first one instead of investigated again. 0 disables it.
  correlationWindowSeconds: 300
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}

watcher:
  # Container termination reasons (pod status).
  reasons: [OOMKilled]
  # Container waiting reasons (pod status), reported once per pod.
  waitingReasons: [ImagePullBackOff, ErrImagePull, CrashLoopBackOff, CreateContainerConfigError]
  # Event reasons, by involved object kind.
  podEventReasons: [FailedScheduling, FailedMount, FailedAttachVolume, Unhealthy]
  pvcEventReasons: [ProvisioningFailed]
  # agents is excluded so the agents never investigate themselves.
  excludedNamespaces: [kube-system, kube-node-lease, argocd, agents]
  cooldownSeconds: 600
  startupGraceSeconds: 300
  # An Unhealthy event is re-checked before it becomes an incident: no earlier than
  # unhealthyRecheckSeconds after the event and unhealthyStartupGraceSeconds after the
  # container started, and only if the pod is still not Ready (hardening REQ-WSU).
  unhealthyStartupGraceSeconds: 60
  unhealthyRecheckSeconds: 30
  resources:
    requests: {cpu: 20m, memory: 128Mi}
    limits: {cpu: 200m, memory: 256Mi}

cpuMemory:
  maxIncreaseFactor: "4"
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}

# The three specialists added by the specialists spec. Same runtime, different tools.
network:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}

deployRollout:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}

storage:
  resources:
    requests: {cpu: 50m, memory: 192Mi}
    limits: {cpu: 500m, memory: 384Mi}

metrics:
  serviceMonitor:
    # The cluster has no Prometheus Operator CRDs yet (REQ-MET-06).
    enabled: false

networkPolicy:
  enabled: true
  prometheus:
    # Namespace allowed to scrape the metrics port. Nothing runs there yet.
    namespaceLabels:
      kubernetes.io/metadata.name: monitoring
  # EKS Pod Identity Agent on every node. Pods fetch their AWS credentials from it.
  podIdentityAgentCIDR: 169.254.170.23/32
