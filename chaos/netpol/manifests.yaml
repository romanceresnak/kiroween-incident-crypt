# Broken NetworkPolicy scenario (specialists REQ-CHS-02). Applied and removed only by
# netpol.sh. The policy admits only app=netpol-trusted, which no pod has, so the client's
# readiness probe times out and the kubelet records Unhealthy events.
# Expected fix: spec.ingress[0].from[0].podSelector.matchLabels.app -> netpol-client.
apiVersion: v1
kind: Namespace
metadata:
  name: chaos-netpol
  labels:
    kiroween/chaos: "true"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-trusted
  namespace: chaos-netpol
spec:
  podSelector:
    matchLabels:
      app: netpol-server
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: netpol-trusted
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: netpol-server
  namespace: chaos-netpol
spec:
  selector:
    app: netpol-server
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-server
  namespace: chaos-netpol
  labels:
    app: netpol-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netpol-server
  template:
    metadata:
      labels:
        app: netpol-server
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          # Public ECR mirror of the official image: no Docker Hub rate limit.
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "echo ok > /www/index.html && exec httpd -f -p 8080 -h /www"]
          ports:
            - containerPort: 8080
          readinessProbe:
            httpGet: {path: /, port: 8080}
            periodSeconds: 10
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - {name: www, mountPath: /www}
      volumes:
        - name: www
          emptyDir:
            sizeLimit: 1Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: netpol-client
  namespace: chaos-netpol
  labels:
    app: netpol-client
spec:
  replicas: 1
  selector:
    matchLabels:
      app: netpol-client
  template:
    metadata:
      labels:
        app: netpol-client
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: client
          image: public.ecr.aws/docker/library/busybox:1.36
          command: ["sh", "-c", "while true; do sleep 3600; done"]
          # Ready only while the server answers. The policy drops the traffic, so the
          # probe times out and the pod never becomes ready.
          readinessProbe:
            exec:
              command: ["wget", "-q", "-T", "2", "-O", "/dev/null", "http://netpol-server:8080/"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests: {cpu: 5m, memory: 8Mi}
            limits: {cpu: 50m, memory: 32Mi}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
